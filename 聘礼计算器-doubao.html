<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭共同储备规划计算器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 620px;
            margin: 30px auto;
            padding: 0 16px;
            background-color: #f7f8fa;
        }
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 2px 12px #00000012;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            color: #222;
            margin-top:0;
        }
        .tip {
            color:#d93025;
            font-size:13px;
            background:#fff2f2;
            padding:10px;
            border-radius:8px;
            margin-bottom:20px;
        }
        .row {
            margin:14px 0;
        }
        label {
            display:block;
            margin-bottom:6px;
            color:#333;
            font-size:14px;
        }
        input, select {
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:16px;
        }
        button {
            width:100%;
            padding:12px;
            background:#3b7bff;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            margin-top:10px;
        }
        button:hover {
            background:#2b68e0;
        }
        .result {
            margin-top:20px;
            padding:16px;
            background:#f0f7ff;
            border-radius:10px;
        }
        .result p {
            margin:8px 0;
            font-size:15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>家庭共同储备规划计算器</h1>
        <div class="tip">
            ⚠️ 重要声明：本工具仅为家庭收支模拟参考，<b>不用于彩礼/聘礼定价、婚姻对价计算</b>；家务价值只是参考补偿模型，婚姻、感情无法金钱量化。
        </div>

        <div class="row">
            <label>配偶月收入（元）</label>
            <input type="number" id="income" placeholder="例如：8000">
        </div>
        <div class="row">
            <label>收入投入家庭比例（%）</label>
            <input type="number" id="rate" placeholder="例如：50">
        </div>
        <div class="row">
            <label>是否承担日常家务</label>
            <select id="doHouse">
                <option value="1">是</option>
                <option value="0">否</option>
            </select>
        </div>
        <div class="row">
            <label>家务单日参考价值（元）</label>
            <input type="number" id="housePrice" placeholder="例如：120">
        </div>
        <div class="row">
            <label>规划计算时长（年）</label>
            <input type="number" id="year" value="5">
        </div>

        <button onclick="calc()">开始计算</button>

        <div class="result" id="resultBox" style="display:none">
            <p>✅ 计算结果：</p>
            <p>收入每年投入家庭金额：<span id="resIncome"></span> 元</p>
            <p>家务每年折算价值：<span id="resHouse"></span> 元</p>
            <p>规划周期内总收入投入合计：<span id="resTotalIncome"></span> 元</p>
            <p>规划周期内家务折算总价值：<span id="resTotalHouse"></span> 元</p>
            <p>家庭储备参考合计（收入+家务折算）：<span id="resAll"></span> 元</p>
        </div>
    </div>

<script>
function calc(){
    const income = Number(document.getElementById('income').value) || 0;
    const rate = Number(document.getElementById('rate').value) || 0;
    const doHouse = Number(document.getElementById('doHouse').value);
    const housePrice = Number(document.getElementById('housePrice').value) || 0;
    const year = Number(document.getElementById('year').value) || 1;

    const yearIncome = income * 12 * (rate / 100);
    const yearHouse = doHouse ? housePrice * 365 : 0;

    const totalIncome = yearIncome * year;
    const totalHouse = yearHouse * year;
    const all = totalIncome + totalHouse;

    document.getElementById('resIncome').innerText = yearIncome.toFixed(2);
    document.getElementById('resHouse').innerText = yearHouse.toFixed(2);
    document.getElementById('resTotalIncome').innerText = totalIncome.toFixed(2);
    document.getElementById('resTotalHouse').innerText = totalHouse.toFixed(2);
    document.getElementById('resAll').innerText = all.toFixed(2);

    document.getElementById('resultBox').style.display = "block";
}
</script>
</body>
</html>
